name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths: ['k8s/**']
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-south-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Fetch KUBECONFIG from SSM Parameter Store
        run: |
          aws ssm get-parameter \
            --name "/k8s/kubeconfig" \
            --with-decryption \
            --query Parameter.Value \
            --output text > kubeconfig
          chmod 600 kubeconfig

      - name: Verify cluster is reachable
        run: KUBECONFIG=./kubeconfig kubectl get nodes

      - name: Apply manifests
        run: KUBECONFIG=./kubeconfig kubectl apply -f k8s/

      - name: Install ingress-nginx controller (stage 2 — only when Ingress resources are present)
        run: |
          # Skip if no Ingress resource has been added to k8s/ yet (stage 1)
          if ! grep -rl 'kind: Ingress' k8s/ | grep -q .; then
            echo "No Ingress resources found — skipping ingress-nginx install"
            exit 0
          fi

          echo "Ingress resources detected — installing ingress-nginx controller"
          KUBECONFIG=./kubeconfig kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/baremetal/deploy.yaml

          # Pin HTTP NodePort to 30080 — must match the NLB target group port in nlb.tf
          KUBECONFIG=./kubeconfig kubectl patch svc ingress-nginx-controller \
            -n ingress-nginx --type=json \
            -p='[{"op":"replace","path":"/spec/ports/0/nodePort","value":30080}]'

          KUBECONFIG=./kubeconfig kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx --timeout=120s

      - name: Wait for rollout
        run: |
          KUBECONFIG=./kubeconfig kubectl rollout status \
            deployment/nginx --timeout=120s

      - name: Show running pods
        run: KUBECONFIG=./kubeconfig kubectl get pods -o wide
