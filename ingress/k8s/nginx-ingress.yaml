# Stage 2: copy this to k8s/nginx-ingress.yaml
# Routes all HTTP traffic entering via the NLB → ingress-nginx → nginx Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
